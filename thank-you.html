
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fffdf7">
  <title>Thank You | Hello Honey</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #fffdf7;
      color: #393a2d;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    main {
      max-width: 520px;
      padding: 45px 28px;
      background: #fff;
      border: 1px solid #eee7d3;
      border-radius: 18px;
    }
    .honey { font-size: 42px; }
    h1 {
      font-family: Georgia, serif;
      font-size: 38px;
      font-weight: normal;
    }
    p { line-height: 1.8; color: #686858; }
    a {
      display: inline-block;
      margin-top: 20px;
      padding: 15px 24px;
      background: #f5d65b;
      color: #393a2d;
      text-decoration: none;
      border-radius: 5px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <main>
    <div class="honey">🍯</div>
    <h1>Thank you, lovely!</h1>
    <p>Your appointment request has been sent successfully.</p>
    <p>We'll review your treatment, preferred time and availability, then get back to you to confirm the details.</p>
    <p>Please remember, your appointment isn't confirmed until we contact you.</p>
    <a href="index.html">Back to Hello Honey</a>
  </main>
</body>
</html>
