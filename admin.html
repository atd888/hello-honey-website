
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fffaf5">
  <meta name="robots" content="noindex, nofollow">
  <title>Private Booking Dashboard | Hello Honey</title>
  <link rel="stylesheet" href="assets/style.css">
  <style>
    .admin-wrap { max-width: 1000px; margin: 40px auto; padding: 20px; }
    .admin-card {
      background: #fff; border: 1px solid #eadfd2;
      border-radius: 16px; padding: 24px; margin-bottom: 20px;
    }
    .admin-card input, .admin-card textarea {
      display: block; width: 100%; box-sizing: border-box;
      padding: 12px; margin: 8px 0 16px;
      border: 1px solid #d9c9b8; border-radius: 8px;
      font: inherit;
    }
    .admin-card button {
      padding: 11px 16px; margin: 5px 5px 5px 0;
      border: 0; border-radius: 8px; cursor: pointer;
      font: inherit;
    }
    .approve { background: #526442; color: white; }
    .decline { background: #8a3e38; color: white; }
    .secondary { background: #f2e8dc; color: #382c20; }
    .booking { border-top: 1px solid #eadfd2; padding: 18px 0; overflow-wrap: anywhere; }
    .message { margin: 12px 0; overflow-wrap: anywhere; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div class="announcement">Hello Honey · Private booking management</div>

  <main class="admin-wrap">
    <section class="admin-card">
      <a href="index.html">← Back to Hello Honey website</a>
      <h1>Booking dashboard</h1>
      <p>Sign in to review appointment requests and manage decisions.</p>
      <p id="message" class="message" role="status" aria-live="polite"></p>

      <form id="login-form">
        <label for="email">Email address</label>
        <input id="email" type="email" autocomplete="username"
          value="artemidaballiu35@gmail.com" required>

        <label for="password">Password</label>
        <input id="password" type="password"
          autocomplete="current-password" required>

        <button class="approve" type="submit">Sign in</button>
      </form>

      <button id="logout" class="secondary" hidden>Sign out</button>
      <button id="refresh" class="secondary" hidden>Refresh bookings</button>
    </section>

    <section id="dashboard" class="admin-card" hidden>
      <h2>Appointment requests</h2>
      <p>Approving or declining changes the booking status.
        Customer email notifications are not yet configured.</p>
      <div id="bookings"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
  (() => {
    const SUPABASE_URL = "https://vynemlcijhhlyuydtrhp.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_jGrlWd0NLC1p6c4tYmaPDg_PMXPk4AW";

    const OWNER_ID = "3a7b2b25-39f7-462a-ace9-e98bd57efe2f";
    const OWNER_EMAIL = "artemidaballiu35@gmail.com";

    const message = document.getElementById("message");
    const loginForm = document.getElementById("login-form");
    const dashboard = document.getElementById("dashboard");
    const bookingsEl = document.getElementById("bookings");
    const logoutBtn = document.getElementById("logout");
    const refreshBtn = document.getElementById("refresh");

    const say = (text) => { message.textContent = text; };
    const safeText = (value) =>
      value == null || value === "" ? "Not provided" : String(value);

    const client = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    async function loadBookings() {
      say("Loading bookings…");
      bookingsEl.replaceChildren();

      const { data, error } = await client
        .from("hello_honey_bookings")
        .select("*")
        .order("created_at", { ascending: false });

      if (error) {
        say("Couldn't load bookings: " + error.message);
        return;
      }

      if (!data || data.length === 0) {
        say("No booking requests found.");
        return;
      }

      data.forEach((booking) => {
        const card = document.createElement("article");
        card.className = "booking";

        const heading = document.createElement("h3");
        heading.textContent = safeText(booking.customer_name);
        card.appendChild(heading);

        const details = [
          ["Status", booking.status],
          ["Email", booking.customer_email],
          ["Phone", booking.customer_phone],
          ["Postcode", booking.postcode],
          ["Address", booking.address],
          ["Treatments", (booking.treatments || []).join(", ")],
          ["Estimated total", "£" + Number(booking.estimated_total).toFixed(2)],
          ["Preferred date", booking.preferred_date],
          ["Preferred time", booking.preferred_time],
          ["Existing product", booking.existing_product],
          ["Notes", booking.customer_notes],
          ["Submitted", booking.created_at
            ? new Date(booking.created_at).toLocaleString("en-GB") : ""],
          ["Admin notes", booking.admin_notes]
        ];

        details.forEach(([label, value]) => {
          const p = document.createElement("p");
          const strong = document.createElement("strong");
          strong.textContent = label + ": ";
          p.appendChild(strong);
          p.appendChild(document.createTextNode(safeText(value)));
          card.appendChild(p);
        });

        if (booking.status === "pending") {
          const label = document.createElement("label");
          label.textContent = "Private admin note (optional)";
          const notes = document.createElement("textarea");
          notes.maxLength = 2000;
          notes.placeholder = "Agreed details or reason for declining";
          card.append(label, notes);

          const approve = document.createElement("button");
          approve.className = "approve";
          approve.textContent = "Approve booking";
          approve.addEventListener("click", () =>
            updateBooking(booking.id, "approved", notes.value));

          const decline = document.createElement("button");
          decline.className = "decline";
          decline.textContent = "Decline booking";
          decline.addEventListener("click", () =>
            updateBooking(booking.id, "declined", notes.value));

          card.append(approve, decline);
        }

        bookingsEl.appendChild(card);
      });

      say("Bookings loaded.");
    }

    async function updateBooking(id, status, adminNotes) {
      if (!["approved", "declined"].includes(status)) return;

      if (!confirm("Are you sure you want to " + status + " this booking?")) {
        return;
      }

      say("Saving decision…");

      const { data, error } = await client
        .from("hello_honey_bookings")
        .update({
          status,
          admin_notes: adminNotes.trim() || null,
          updated_at: new Date().toISOString()
        })
        .eq("id", id)
        .eq("status", "pending")
        .select("id");

      if (error) {
        say("Couldn't update booking: " + error.message);
        return;
      }

      if (!data || data.length === 0) {
        say("No booking changed. It may already have been updated or access was denied.");
        return;
      }

      say("Decision saved. Customer email notifications are not configured yet.");
      await loadBookings();
    }

    async function checkSession() {
      const { data, error } = await client.auth.getSession();

      if (error) {
        say("Couldn't check login: " + error.message);
        return;
      }

      const user = data.session?.user;

      if (!user) {
        loginForm.hidden = false;
        dashboard.hidden = true;
        logoutBtn.hidden = true;
        refreshBtn.hidden = true;
        return;
      }

      if (user.id !== OWNER_ID || user.email !== OWNER_EMAIL) {
        await client.auth.signOut();
        say("Access denied. This dashboard is reserved for Artemida.");
        return;
      }

      loginForm.hidden = true;
      dashboard.hidden = false;
      logoutBtn.hidden = false;
      refreshBtn.hidden = false;
      await loadBookings();
    }

    loginForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      say("Signing in…");

      const { error } = await client.auth.signInWithPassword({
        email: document.getElementById("email").value.trim(),
        password: document.getElementById("password").value
      });

      if (error) {
        say("Sign-in failed: " + error.message);
        return;
      }

      await checkSession();
    });

    logoutBtn.addEventListener("click", async () => {
      await client.auth.signOut();
      say("You've signed out.");
      await checkSession();
    });

    refreshBtn.addEventListener("click", loadBookings);

    checkSession();
  })();
  </script>
</body>
</html>
