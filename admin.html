
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fffaf5">
  <meta name="robots" content="noindex, nofollow">
  <title>Private Booking Dashboard | Hello Honey</title>
  <link rel="stylesheet" href="assets/style.css">
  <style>
    .admin-wrap {
      max-width: 1000px;
      margin: 40px auto;
      padding: 20px;
    }

    .admin-card {
      background: #fff;
      border: 1px solid #eadfd2;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 20px;
    }

    .admin-card input,
    .admin-card textarea {
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin: 8px 0 16px;
      border: 1px solid #d9c9b8;
      border-radius: 8px;
      font: inherit;
    }

    .admin-card button {
      padding: 11px 16px;
      margin: 5px 5px 5px 0;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      font: inherit;
    }

    .admin-card button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .approve {
      background: #526442;
      color: white;
    }

    .decline {
      background: #8a3e38;
      color: white;
    }

    .delete-test {
      background: #f8e1df;
      color: #7a2420;
      border: 1px solid #d8aaa5 !important;
    }

    .secondary {
      background: #f2e8dc;
      color: #382c20;
    }

    .booking {
      border-top: 1px solid #eadfd2;
      padding: 18px 0;
      overflow-wrap: anywhere;
    }

    .message {
      margin: 12px 0;
      overflow-wrap: anywhere;
    }

    [hidden] {
      display: none !important;
    }
  </style>
</head>

<body>
  <div class="announcement">
    Hello Honey · Private booking management
  </div>

  <main class="admin-wrap">
    <section class="admin-card">
      <a href="index.html">← Back to Hello Honey website</a>

      <h1>Booking dashboard</h1>
      <p>Sign in to review appointment requests and manage decisions.</p>

      <p id="message" class="message" role="status" aria-live="polite"></p>

      <form id="login-form">
        <label for="email">Email address</label>
        <input
          id="email"
          type="email"
          autocomplete="username"
          value="artemidaballiu35@gmail.com"
          required
        >

        <label for="password">Password</label>
        <input
          id="password"
          type="password"
          autocomplete="current-password"
          required
        >

        <button class="approve" type="submit">Sign in</button>
      </form>

      <button id="forgot-password" class="secondary" type="button">
        Forgot password?
      </button>

      <button id="logout" class="secondary" type="button" hidden>
        Sign out
      </button>

      <button id="refresh" class="secondary" type="button" hidden>
        Refresh bookings
      </button>
    </section>

    <section id="dashboard" class="admin-card" hidden>
      <h2>Appointment requests</h2>
      <p>
        Review each request. Approving or declining saves your decision
        and then attempts to email the customer.
      </p>
      <div id="bookings"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
  (() => {
    "use strict";

    const SUPABASE_URL =
      "https://vynemlcijhhlyuydtrhp.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_jGrlWd0NLC1p6c4tYmaPDg_PMXPk4AW";

    const OWNER_ID = "3a7b2b25-39f7-462a-ace9-e98bd57efe2f";
    const OWNER_EMAIL = "artemidaballiu35@gmail.com";

    const RESET_PASSWORD_URL =
      "https://atd888.github.io/hello-honey-website/reset-password.html";

    const message = document.getElementById("message");
    const loginForm = document.getElementById("login-form");
    const dashboard = document.getElementById("dashboard");
    const bookingsEl = document.getElementById("bookings");
    const logoutBtn = document.getElementById("logout");
    const refreshBtn = document.getElementById("refresh");
    const forgotPasswordBtn =
      document.getElementById("forgot-password");
    const emailInput = document.getElementById("email");

    const processingBookings = new Set();

    const client = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    function say(text) {
      message.textContent = text;
    }

    function safeText(value) {
      return value == null || value === ""
        ? "Not provided"
        : String(value);
    }

    async function loadBookings(options = {}) {
      const silent = options.silent === true;

      if (!silent) {
        say("Loading bookings…");
      }

      const { data, error } = await client
        .from("hello_honey_bookings")
        .select("*")
        .order("created_at", { ascending: false });

      if (error) {
        if (!silent) {
          say("Couldn't load bookings: " + error.message);
        }
        return false;
      }

      bookingsEl.replaceChildren();

      if (!data || data.length === 0) {
        const empty = document.createElement("p");
        empty.textContent = "No booking requests found.";
        bookingsEl.appendChild(empty);

        if (!silent) {
          say("No booking requests found.");
        }

        return true;
      }

      data.forEach((booking) => {
        const card = document.createElement("article");
        card.className = "booking";

        const heading = document.createElement("h3");
        heading.textContent = safeText(booking.customer_name);
        card.appendChild(heading);

        const details = [
          ["Status", booking.status],
          ["Deposit", booking.payment_status === "paid" ? "Paid" : "Not paid"],
          ["Email", booking.customer_email],
          ["Phone", booking.customer_phone],
          ["Postcode", booking.postcode],
          ["Address", booking.address],
          ["Treatments", (booking.treatments || []).join(", ")],
          [
            "Estimated total",
            "£" + Number(booking.estimated_total).toFixed(2)
          ],
          ["Preferred date", booking.preferred_date],
          ["Preferred time", booking.preferred_time],
          ["Existing product", booking.existing_product],
          ["Notes", booking.customer_notes],
          [
            "Submitted",
            booking.created_at
              ? new Date(booking.created_at).toLocaleString("en-GB")
              : ""
          ],
          ["Admin notes", booking.admin_notes]
        ];

        details.forEach(([label, value]) => {
          const p = document.createElement("p");
          const strong = document.createElement("strong");

          strong.textContent = label + ": ";
          p.appendChild(strong);
          p.appendChild(document.createTextNode(safeText(value)));
          card.appendChild(p);
        });

        // Delete button for any booking.
        const deleteBooking = document.createElement("button");
        deleteBooking.type = "button";
        deleteBooking.className = "delete-test";
        deleteBooking.textContent = "Delete booking";

        deleteBooking.addEventListener("click", () => {
          deleteAnyBooking(
            booking.id,
            booking.customer_name,
            deleteBooking
          );
        });

        card.appendChild(deleteBooking);

        if (booking.status === "pending") {
          const label = document.createElement("label");
          label.textContent = "Private admin note (optional)";

          const notes = document.createElement("textarea");
          notes.maxLength = 2000;
          notes.placeholder = "Agreed details or reason for declining";

          const approve = document.createElement("button");
          approve.type = "button";
          approve.className = "approve";
          approve.textContent = "Approve booking";

          const decline = document.createElement("button");
          decline.type = "button";
          decline.className = "decline";
          decline.textContent = "Decline booking";

          const decisionButtons = [approve, decline];

          approve.addEventListener("click", () => {
            updateBooking(
              booking.id,
              "approved",
              notes.value,
              decisionButtons
            );
          });

          decline.addEventListener("click", () => {
            updateBooking(
              booking.id,
              "declined",
              notes.value,
              decisionButtons
            );
          });

          card.append(label, notes, approve, decline);
        }

        bookingsEl.appendChild(card);
      });

      if (!silent) {
        say("Bookings loaded.");
      }

      return true;
    }

    async function deleteAnyBooking(id, customerName, button) {
      const confirmed = confirm(
        'Permanently delete the booking for "' +
        String(customerName || "Unknown customer") +
        '"? This cannot be undone.'
      );

      if (!confirmed) return;

      button.disabled = true;
      say("Deleting booking…");

      try {
        const { data, error } = await client
          .from("hello_honey_bookings")
          .delete()
          .eq("id", id)
          .select("id");

        if (error) {
          say("Couldn't delete booking: " + error.message);
          return;
        }

        if (!data || data.length === 0) {
          say(
            "No booking was deleted. Check your owner login, " +
            "database permissions and delete policy."
          );
          return;
        }

        const refreshed = await loadBookings({ silent: true });

        say(
          "Booking deleted successfully." +
          (refreshed ? "" : " Please refresh the bookings list.")
        );
      } catch (error) {
        say(
          "Couldn't delete booking: " +
          (error instanceof Error ? error.message : String(error))
        );
      } finally {
        button.disabled = false;
      }
    }

    async function updateBooking(id, status, adminNotes, buttons) {
      if (!["approved", "declined"].includes(status)) {
        return;
      }

      if (processingBookings.has(id)) {
        return;
      }

      if (!confirm("Are you sure you want to " + status + " this booking?")) {
        return;
      }

      processingBookings.add(id);

      buttons.forEach((button) => {
        button.disabled = true;
      });

      let decisionSaved = false;

      try {
        say("Saving decision…");

        const { data, error } = await client
          .from("hello_honey_bookings")
          .update({
            status: status,
            admin_notes: adminNotes.trim() || null,
            updated_at: new Date().toISOString()
          })
          .eq("id", id)
          .eq("status", "pending")
          .select("id");

        if (error) {
          say("Couldn't save the decision: " + error.message);
          return;
        }

        if (!data || data.length === 0) {
          say(
            "No booking was changed. It may already have been updated " +
            "or your account may not have permission."
          );

          await loadBookings();
          return;
        }

        decisionSaved = true;
        say("Decision saved. Sending customer email…");

        let emailSent = false;
        let emailProblem = "";

        try {
          const { data: emailData, error: emailError } =
            await client.functions.invoke(
              "hello-honey-decision-email",
              {
                body: {
                  bookingId: id,
                  decision: status
                }
              }
            );

          if (emailError) {
            emailProblem =
              emailError.message ||
              "The email function returned an error.";
          } else if (emailData && emailData.success === true) {
            emailSent = true;
          } else {
            emailProblem =
              emailData && emailData.error
                ? String(emailData.error)
                : "The function did not confirm email success.";
          }
        } catch (error) {
          emailProblem = error instanceof Error
            ? error.message
            : "An unexpected email error occurred.";
        }

        let bookingsRefreshed = false;

        try {
          bookingsRefreshed = await loadBookings({ silent: true });
        } catch (_) {
          bookingsRefreshed = false;
        }

        if (emailSent) {
          say(
            "Booking " + status + " successfully. " +
            "Resend accepted the customer email." +
            (bookingsRefreshed
              ? ""
              : " The booking list could not be refreshed; use Refresh bookings.")
          );
        } else {
          say(
            "The booking decision was saved as " + status +
            ", but the customer email could not be confirmed. " +
            "Check the hello-honey-decision-email logs in Supabase." +
            (emailProblem ? " Details: " + emailProblem : "") +
            (bookingsRefreshed
              ? ""
              : " The booking list could not be refreshed; use Refresh bookings.")
          );
        }
      } catch (error) {
        say(
          decisionSaved
            ? "The booking decision was saved, but a later step failed. " +
              "Check the booking status and email function logs before retrying."
            : "An unexpected error occurred: " +
              (error instanceof Error ? error.message : String(error))
        );
      } finally {
        processingBookings.delete(id);

        buttons.forEach((button) => {
          button.disabled = false;
        });
      }
    }

    async function checkSession() {
      const { data, error } = await client.auth.getSession();

      if (error) {
        say("Couldn't check login: " + error.message);
        return;
      }

      const user = data.session?.user;

      if (!user) {
        loginForm.hidden = false;
        dashboard.hidden = true;
        logoutBtn.hidden = true;
        refreshBtn.hidden = true;
        forgotPasswordBtn.hidden = false;
        return;
      }

      if (
        user.id !== OWNER_ID ||
        (user.email || "").toLowerCase() !== OWNER_EMAIL.toLowerCase()
      ) {
        await client.auth.signOut();

        loginForm.hidden = false;
        dashboard.hidden = true;
        logoutBtn.hidden = true;
        refreshBtn.hidden = true;
        forgotPasswordBtn.hidden = false;

        say("Access denied. This dashboard is reserved for Artemida.");
        return;
      }

      loginForm.hidden = true;
      dashboard.hidden = false;
      logoutBtn.hidden = false;
      refreshBtn.hidden = false;
      forgotPasswordBtn.hidden = true;

      await loadBookings();
    }

    forgotPasswordBtn.addEventListener("click", async () => {
      const email = emailInput.value.trim();

      if (!email) {
        say("Enter your account email address first.");
        emailInput.focus();
        return;
      }

      forgotPasswordBtn.disabled = true;
      say("Requesting a password-reset email…");

      try {
        const { error } = await client.auth.resetPasswordForEmail(email, {
          redirectTo: RESET_PASSWORD_URL
        });

        if (error) {
          say("Couldn't request a reset email: " + error.message);
          return;
        }

        say(
          "If an account exists for that email, Supabase will send a " +
          "password-reset message. Check your inbox and spam folder. " +
          "If you recently requested emails, wait for the rate limit " +
          "to clear before trying again."
        );
      } catch (error) {
        say(
          "Couldn't request a reset email: " +
          (error instanceof Error ? error.message : String(error))
        );
      } finally {
        forgotPasswordBtn.disabled = false;
      }
    });

    loginForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      say("Signing in…");

      const { error } = await client.auth.signInWithPassword({
        email: emailInput.value.trim(),
        password: document.getElementById("password").value
      });

      if (error) {
        say("Sign-in failed: " + error.message);
        return;
      }

      await checkSession();
    });

    logoutBtn.addEventListener("click", async () => {
      const { error } = await client.auth.signOut();

      if (error) {
        say("Sign-out failed: " + error.message);
        return;
      }

      say("You've signed out.");
      await checkSession();
    });

    refreshBtn.addEventListener("click", () => {
      loadBookings();
    });

    checkSession();
  })();
  </script>
</body>
</html>
