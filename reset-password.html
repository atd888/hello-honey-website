
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fffaf5">
  <title>Reset Password | Hello Honey</title>
  <link rel="stylesheet" href="assets/style.css">
  <style>
    body {
      background: #fffaf5;
      min-height: 100vh;
    }
    .reset-wrap {
      max-width: 460px;
      margin: 70px auto;
      padding: 24px;
    }
    .reset-card {
      background: white;
      border: 1px solid #eadfce;
      border-radius: 18px;
      padding: 28px;
    }
    .reset-card h1 {
      margin-top: 0;
    }
    .reset-card label {
      display: block;
      margin: 16px 0 6px;
    }
    .reset-card input {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      border: 1px solid #cdbfae;
      border-radius: 8px;
      font: inherit;
    }
    .reset-card button {
      width: 100%;
      margin-top: 20px;
      cursor: pointer;
    }
    #message {
      margin-top: 16px;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <div class="reset-wrap">
    <a class="brand" href="index.html">
      <strong>hello honey</strong>
      <span>mobile nail studio</span>
    </a>

    <div class="reset-card">
      <h1>Choose a new password</h1>
      <p>Set a new password for your Hello Honey admin account.</p>

      <form id="reset-form">
        <label for="password">New password</label>
        <input
          id="password"
          type="password"
          minlength="8"
          autocomplete="new-password"
          required
          placeholder="At least 8 characters"
        >

        <label for="confirm-password">Confirm new password</label>
        <input
          id="confirm-password"
          type="password"
          minlength="8"
          autocomplete="new-password"
          required
          placeholder="Enter it again"
        >

        <button class="btn" id="save-button" type="submit">
          Save new password
        </button>
      </form>

      <p id="message" role="status" aria-live="polite"></p>
      <p><a href="admin.html">Return to admin login</a></p>
    </div>
  </div>

  <script type="module">
    import { createClient } from
      "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    const supabase = createClient(
      "https://vynemlcijhhlyuydtrhp.supabase.co",
      "sb_publishable_jGrlWd0NLC1p6c4tYmaPDg_PMXPk4AW"
    );

    const form = document.getElementById("reset-form");
    const button = document.getElementById("save-button");
    const message = document.getElementById("message");

    function showMessage(text, error = false) {
      message.textContent = text;
      message.style.color = error ? "#9b2c2c" : "#47623b";
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const password = document.getElementById("password").value;
      const confirmPassword =
        document.getElementById("confirm-password").value;

      if (password.length < 8) {
        showMessage("Please use at least 8 characters.", true);
        return;
      }

      if (password !== confirmPassword) {
        showMessage("The passwords do not match.", true);
        return;
      }

      button.disabled = true;
      button.textContent = "Saving…";
      showMessage("");

      try {
        const { data: sessionData, error: sessionError } =
          await supabase.auth.getSession();

        if (sessionError || !sessionData.session) {
          showMessage(
            "This reset link is invalid or has expired. Please request a new password-reset email.",
            true
          );
          return;
        }

        const { error } = await supabase.auth.updateUser({ password });

        if (error) {
          showMessage(error.message, true);
          return;
        }

        form.reset();
        showMessage(
          "Your password has been changed. Return to admin login and sign in with your new password."
        );
      } catch (_) {
        showMessage(
          "We couldn't complete the reset. Please request a new reset email and try again.",
          true
        );
      } finally {
        button.disabled = false;
        button.textContent = "Save new password";
      }
    });
  </script>
</body>
</html>
